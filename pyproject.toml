[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repohunter"
version = "0.1.0"
description = "Reuse, don't reinvent — the reuse-first scout for open source. Evaluate repos for your project and your machine, then plan the integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Chris Gorzelic" }, { name = "Ziggy" }]
keywords = ["open-source", "developer-tools", "code-reuse", "ai", "mcp", "cli", "github"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []  # stdlib only — no install step

[project.urls]
Homepage = "https://repohunter.dev"
Repository = "https://github.com/meetziggy/repohunter"
Changelog = "https://github.com/meetziggy/repohunter/blob/main/CHANGELOG.md"

[project.scripts]
repohunter = "repohunter:main"
repohunter-mcp = "repohunter_mcp:main"

[tool.setuptools]
py-modules = ["repohunter", "repohunter_mcp"]
