<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="RepoHunter">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff7a"/><stop offset=".5" stop-color="#b8ff3c"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ff3c"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="eye" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#f0ffd6"/><stop offset=".5" stop-color="#b8ff3c"/><stop offset="1" stop-color="#2f9e5a"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="200" height="200" rx="46" fill="#0b1220" stroke="#22304a" stroke-width="2"/>
  <g filter="url(#glow)">
    <g fill="url(#wing)" fill-opacity=".42" stroke="url(#wing)" stroke-width="2">
      <!-- hindwings (rear pair): broader at the base, drawn behind -->
      <g transform="rotate(16 120 96)"><ellipse cx="72" cy="115" rx="45" ry="16"/>
        <line x1="30" y1="115" x2="114" y2="115" stroke="#dbeafe" stroke-width="1" opacity=".4"/></g>
      <g transform="rotate(-16 120 96)"><ellipse cx="168" cy="115" rx="45" ry="16"/>
        <line x1="126" y1="115" x2="210" y2="115" stroke="#dbeafe" stroke-width="1" opacity=".4"/></g>
      <!-- forewings (front pair): slenderer, drawn on top -->
      <g transform="rotate(-13 120 96)"><ellipse cx="73" cy="87" rx="47" ry="11.5"/>
        <line x1="30" y1="87" x2="117" y2="87" stroke="#dbeafe" stroke-width="1" opacity=".4"/></g>
      <g transform="rotate(13 120 96)"><ellipse cx="167" cy="87" rx="47" ry="11.5"/>
        <line x1="123" y1="87" x2="210" y2="87" stroke="#dbeafe" stroke-width="1" opacity=".4"/></g>
    </g>
    <ellipse cx="120" cy="96" rx="11" ry="17" fill="url(#body)"/>
    <path d="M111 104 Q120 100 129 104 L124 196 Q120 205 116 196 Z" fill="url(#body)"/>
    <g stroke="#0b1220" stroke-width="1.6" opacity=".45">
      <line x1="115" y1="126" x2="125" y2="126"/><line x1="115.5" y1="144" x2="124.5" y2="144"/>
      <line x1="116" y1="162" x2="124" y2="162"/><line x1="116.5" y1="180" x2="123.5" y2="180"/>
    </g>
    <ellipse cx="120" cy="70" rx="15.5" ry="11" fill="url(#body)"/>
    <!-- eyes with personality: big compound domes, forward gaze, bright catchlights -->
    <g>
      <circle cx="112" cy="66" r="8" fill="url(#eye)"/>
      <circle cx="112.8" cy="67.2" r="3.7" fill="#0a1710"/>
      <circle cx="110.8" cy="65.1" r="1.8" fill="#f4ffe0"/>
      <circle cx="113.5" cy="68.5" r=".8" fill="#eafff0" opacity=".6"/>
    </g>
    <g>
      <circle cx="128" cy="66" r="8" fill="url(#eye)"/>
      <circle cx="127.2" cy="67.2" r="3.7" fill="#0a1710"/>
      <circle cx="126.4" cy="65.1" r="1.8" fill="#f4ffe0"/>
      <circle cx="128.9" cy="68.5" r=".8" fill="#eafff0" opacity=".6"/>
    </g>
  </g>
</svg>
