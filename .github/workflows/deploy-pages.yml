name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-pages.yml"

jobs:
  deploy:
    name: Deploy site/ to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets.
      # Neither exists yet as of this PR — that needs repo-admin access, which
      # the account that opened this PR does not have. Until they're added,
      # this job fails at this step with a clear "missing secret" error
      # rather than silently doing nothing; that's intentional so the gap is
      # visible instead of assumed-working.
      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: repohunter
          directory: site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke check
        run: python3 scripts/smoke_check_site.py
